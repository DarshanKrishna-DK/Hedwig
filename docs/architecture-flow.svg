<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#1a202c">x402 payment flow on Hedera</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#6b7280">what happens when the agent calls x402_fetch on a paid endpoint</text>

  <!-- Lane headers -->
  <g font-size="13" font-weight="600">
    <rect x="40" y="85" width="180" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="130" y="110" text-anchor="middle" fill="#1e3a8a">Agent</text>

    <rect x="240" y="85" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="330" y="110" text-anchor="middle" fill="#14532d">Hedwig</text>

    <rect x="440" y="85" width="200" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="540" y="110" text-anchor="middle" fill="#7c2d12">Resource server</text>

    <rect x="660" y="85" width="200" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="760" y="110" text-anchor="middle" fill="#4c1d95">Hedera</text>
  </g>

  <!-- Lifelines -->
  <line x1="130" y1="125" x2="130" y2="735" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="330" y1="125" x2="330" y2="735" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="540" y1="125" x2="540" y2="735" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="760" y1="125" x2="760" y2="735" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step 1: agent -> hedwig -->
  <g>
    <line x1="130" y1="160" x2="325" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrBlue)"/>
    <text x="140" y="152" font-size="11" fill="#1e3a8a">1. fetch URL (via x402_fetch)</text>
  </g>

  <!-- Step 2: hedwig -> server -->
  <g>
    <line x1="330" y1="200" x2="535" y2="200" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="340" y="192" font-size="11" fill="#4a5568">2. GET /premium/quote</text>
  </g>

  <!-- Step 3: server -> hedwig (402) -->
  <g>
    <line x1="540" y1="240" x2="335" y2="240" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="425" y="232" font-size="11" fill="#7c2d12" text-anchor="middle">3. 402 Payment Required + challenge</text>
  </g>

  <!-- Step 4: hedwig internal work -->
  <g>
    <rect x="260" y="270" width="140" height="55" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="330" y="290" text-anchor="middle" font-size="11" fill="#14532d">4. sign USDC transfer</text>
    <text x="330" y="306" text-anchor="middle" font-size="10" fill="#166534">(client-side, no</text>
    <text x="330" y="319" text-anchor="middle" font-size="10" fill="#166534">network yet)</text>
  </g>

  <!-- Step 5: hedwig -> server with signature -->
  <g>
    <line x1="330" y1="360" x2="535" y2="360" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="340" y="352" font-size="11" fill="#4a5568">5. retry with payment-signature header</text>
  </g>

  <!-- Step 6: server internal - verify -->
  <g>
    <rect x="470" y="385" width="140" height="35" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <text x="540" y="407" text-anchor="middle" font-size="11" fill="#7c2d12">6. verify signature</text>
  </g>

  <!-- Step 7: server -> hedera (submit) -->
  <g>
    <line x1="540" y1="450" x2="755" y2="450" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="550" y="442" font-size="11" fill="#4a5568">7. submit signed transaction</text>
  </g>

  <!-- Step 8: hedera -> server (receipt) -->
  <g>
    <line x1="760" y1="500" x2="545" y2="500" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="650" y="492" font-size="11" fill="#4c1d95" text-anchor="middle">8. consensus + receipt (about 3 seconds)</text>
  </g>

  <!-- Step 9: server -> hedwig (200 + content) -->
  <g>
    <line x1="540" y1="545" x2="335" y2="545" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="425" y="537" font-size="11" fill="#7c2d12" text-anchor="middle">9. 200 OK + paid content + payment-response header</text>
  </g>

  <!-- Step 10: hedwig -> agent -->
  <g>
    <line x1="330" y1="590" x2="135" y2="590" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrBlue)"/>
    <text x="140" y="582" font-size="11" fill="#1e3a8a">10. quote + HashScan link</text>
  </g>

  <!-- Footer note -->
  <g>
    <rect x="60" y="640" width="780" height="85" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="80" y="663" font-size="12" font-weight="600" fill="#1f2937">Notes on this flow</text>
    <text x="80" y="683" font-size="11" fill="#4a5568">- The signature in step 4 authorizes a single USDC transfer from buyer to seller. Only the buyer signs.</text>
    <text x="80" y="700" font-size="11" fill="#4a5568">- The resource server (facilitator) adds its own signature to pay HBAR gas, then submits in step 7. Buyer pays no gas.</text>
    <text x="80" y="717" font-size="11" fill="#4a5568">- The receipt in step 10 is a HashScan URL. No escrow, no bridge, no reconciliation. The chain is the truth.</text>
  </g>
</svg>
