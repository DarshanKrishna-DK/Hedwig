<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="'Space Grotesk', system-ui, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8259EF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8259EF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8259EF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(130,89,239,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="900" fill="#0A0B14"/>
  <rect width="1400" height="900" fill="url(#grid)"/>

  <circle cx="500" cy="400" r="350" fill="url(#glow)"/>
  <circle cx="900" cy="500" r="300" fill="url(#purpleGlow)"/>

  <rect x="0" y="0" width="1400" height="72" fill="#0A0B14" fill-opacity="0.6"/>
  <line x1="0" y1="72" x2="1400" y2="72" stroke="#1F2033"/>
  <text x="80" y="45" font-family="'Press Start 2P', monospace" font-size="14" fill="url(#grad)">HEDWIG</text>

  <g font-size="14" fill="#71717A">
    <text x="900" y="45">Features</text>
    <text x="985" y="45">Protocol</text>
    <text x="1070" y="45">MCP</text>
    <text x="1120" y="45" fill="#22D3EE">Docs</text>
  </g>

  <text x="1200" y="45" font-size="14" fill="#71717A">GitHub</text>
  <rect x="1260" y="26" width="115" height="32" rx="8" fill="url(#grad)"/>
  <text x="1275" y="47" font-size="13" font-weight="600" fill="#0A0B14">&gt; Get Started</text>

  <g font-family="'Press Start 2P', monospace">
    <text x="80" y="230" font-size="30" fill="#F5F5F7">The wallet</text>
    <text x="80" y="285" font-size="30" fill="#F5F5F7">for </text>
    <text x="180" y="285" font-size="30" fill="url(#grad)">autonomous</text>
    <text x="80" y="340" font-size="30" fill="url(#grad)">agents</text>
  </g>

  <text x="80" y="395" font-size="16" fill="#71717A">Hedwig gives AI agents a Hedera wallet they can drive themselves.</text>
  <text x="80" y="418" font-size="16" fill="#71717A">It intercepts HTTP</text>
  <rect x="235" y="405" width="35" height="20" rx="4" fill="rgba(34,211,238,0.08)"/>
  <text x="242" y="420" font-family="'JetBrains Mono', monospace" font-size="13" fill="#22D3EE">402</text>
  <text x="278" y="418" font-size="16" fill="#71717A">responses, signs HBAR or USDC micropayments,</text>
  <text x="80" y="441" font-size="16" fill="#71717A">and retries with proof. Ships as an MCP server for Claude Desktop.</text>

  <rect x="80" y="475" width="145" height="46" rx="10" fill="url(#grad)"/>
  <text x="105" y="503" font-size="14" font-weight="600" fill="#0A0B14">&gt; Get Started</text>

  <rect x="240" y="475" width="180" height="46" rx="10" fill="none" stroke="#1F2033" stroke-width="1.5"/>
  <text x="260" y="503" font-size="14" fill="#71717A">Read the protocol</text>

  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">
    <circle cx="88" cy="565" r="3" fill="#22D3EE"/>
    <text x="100" y="569">Hedera native</text>
    <circle cx="205" cy="565" r="3" fill="#8259EF"/>
    <text x="217" y="569">x402 protocol</text>
    <circle cx="325" cy="565" r="3" fill="#4ade80"/>
    <text x="337" y="569">Open source</text>
  </g>

  <g transform="translate(760, 200)">
    <rect x="-20" y="-15" width="580" height="450" rx="18" fill="rgba(34,211,238,0.06)" filter="blur(30px)"/>
    <rect x="0" y="0" width="540" height="420" rx="14" fill="#13141F" stroke="rgba(34,211,238,0.22)"/>

    <rect x="0" y="0" width="540" height="40" rx="14" fill="#0A0B14"/>
    <rect x="0" y="26" width="540" height="14" fill="#0A0B14"/>
    <line x1="0" y1="40" x2="540" y2="40" stroke="#1F2033"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="20" r="5" fill="#27c93f"/>
    <text x="82" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">claude ~ hedwig</text>

    <g font-family="'JetBrains Mono', monospace" font-size="12">
      <text x="20" y="70" fill="#71717A">&gt; Fetch /premium/quote and pay if it costs USDC</text>

      <text x="20" y="105" fill="#8259EF">[Hedwig]</text>
      <text x="88" y="105" fill="#71717A">402 - payment required</text>

      <text x="20" y="130" fill="#8259EF">[Hedwig]</text>
      <text x="88" y="130" fill="#71717A">budget </text>
      <text x="140" y="130" fill="#4ade80">OK</text>
      <text x="164" y="130" fill="#71717A">- signing USDC on Hedera</text>

      <text x="20" y="155" fill="#8259EF">[Hedwig]</text>
      <text x="88" y="155" fill="#71717A">settled </text>
      <text x="148" y="155" fill="#4ade80">0.0.6886052@178...</text>

      <text x="20" y="185" fill="#4ade80">200 OK</text>

      <text x="20" y="215" fill="#71717A">{</text>
      <text x="35" y="238" fill="#22D3EE">"quote"</text>
      <text x="88" y="238" fill="#71717A">:</text>
      <text x="98" y="238" fill="#22D3EE">"In the middle of every..."</text>
      <text x="330" y="238" fill="#71717A">,</text>
      <text x="35" y="261" fill="#22D3EE">"paid"</text>
      <text x="80" y="261" fill="#71717A">:</text>
      <text x="90" y="261" fill="#8259EF">0.001 USDC</text>
      <text x="20" y="284" fill="#71717A">}</text>

      <text x="20" y="315" fill="#71717A" fill-opacity="0.5">&gt;</text>
      <rect x="34" y="304" width="7" height="14" fill="rgba(34,211,238,0.55)"/>
    </g>
  </g>

  <g transform="translate(0, 720)">
    <line x1="60" y1="0" x2="1340" y2="0" stroke="#1F2033" opacity="0.5"/>

    <g transform="translate(200, 60)">
      <text text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="16" fill="url(#grad)">~3s</text>
      <text y="30" text-anchor="middle" font-size="13" font-weight="500" fill="#F5F5F7">Payment finality</text>
      <text y="48" text-anchor="middle" font-size="10" fill="#71717A">402 to settled on chain</text>
    </g>

    <g transform="translate(500, 60)">
      <text text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="16" fill="url(#grad)">$0.0001</text>
      <text y="30" text-anchor="middle" font-size="13" font-weight="500" fill="#F5F5F7">Per-tx fee</text>
      <text y="48" text-anchor="middle" font-size="10" fill="#71717A">HBAR native, fixed</text>
    </g>

    <g transform="translate(800, 60)">
      <text text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="16" fill="url(#grad)">7</text>
      <text y="30" text-anchor="middle" font-size="13" font-weight="500" fill="#F5F5F7">MCP tools</text>
      <text y="48" text-anchor="middle" font-size="10" fill="#71717A">wallet + x402 + audit</text>
    </g>

    <g transform="translate(1100, 60)">
      <text text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="16" fill="url(#grad)">10</text>
      <text y="30" text-anchor="middle" font-size="13" font-weight="500" fill="#F5F5F7">Automated tests</text>
      <text y="48" text-anchor="middle" font-size="10" fill="#71717A">Vitest unit suite</text>
    </g>
  </g>
</svg>
